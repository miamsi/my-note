<!doctype html>
<html lang="en" data-t="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Desknotes</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
<style>
:root{--ac:#0f8b8d;--bg:#eef1f5;--pn:#fff;--tx:#18212b;--mu:#66717e;--ln:#dde2e9;--fs:16px;--ff:system-ui,-apple-system,"Segoe UI",sans-serif}
html[data-t=dark]{--bg:#12161c;--pn:#1b2129;--tx:#e6eaf0;--mu:#8b96a3;--ln:#2a323c}
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--tx);font:var(--fs)/1.6 var(--ff);height:100dvh;overflow:hidden}
button,input,textarea{font:inherit;color:inherit}
button{background:var(--pn);border:1px solid var(--ln);border-radius:8px;padding:6px 12px;cursor:pointer;white-space:nowrap}
button:hover{border-color:var(--ac)}button.p{background:var(--ac);border-color:var(--ac);color:#fff}button.d:hover{border-color:#d33;color:#d33}
input,textarea{background:var(--pn);border:1px solid var(--ln);border-radius:8px;padding:8px 12px;width:100%}
:focus-visible{outline:2px solid var(--ac);outline-offset:1px}
#auth,#shared{max-width:420px;margin:12vh auto;padding:24px;display:grid;gap:12px}
#shared{max-width:760px;margin:0 auto;height:100dvh;overflow:auto;background:var(--pn)}
#app{display:grid;grid-template-columns:320px 1fr;height:100dvh;padding-top:env(safe-area-inset-top)}
#side{border-right:1px solid var(--ln);background:var(--pn);display:flex;flex-direction:column;min-height:0}
#side header,#bar{padding:10px 12px;display:flex;gap:8px;align-items:center}
#list{overflow:auto;flex:1}
.it{display:flex;gap:8px;padding:10px 12px;border-bottom:1px solid var(--ln);cursor:pointer}
.it.on{background:color-mix(in srgb,var(--ac) 14%,transparent);box-shadow:inset 3px 0 var(--ac)}
.it b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.it small{color:var(--mu);display:block;max-height:3em;overflow:hidden}
.it input{width:auto;margin-top:6px}
#main{display:flex;flex-direction:column;min-width:0;min-height:0}
#bar{overflow-x:auto;border-bottom:1px solid var(--ln);background:var(--pn)}
#doc{flex:1;overflow:auto;padding:16px clamp(12px,5vw,48px) 24px;min-height:0}
#title{font-size:1.6em;font-weight:700;border:0;background:none;padding:4px 0}
#body{border:0;background:none;min-height:50dvh;resize:none;padding:4px 0;line-height:1.7}
#view{min-height:40%}#view mark,.pa mark{background:color-mix(in srgb,var(--ac) 30%,transparent);border-radius:4px;padding:0 3px}
#ai{border-top:1px solid var(--ln);background:var(--pn);padding:10px 12px;max-height:45%;overflow:auto;padding-bottom:calc(10px + env(safe-area-inset-bottom))}
#ai .r{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px}#out{margin-top:8px}
.chip{border-radius:99px;padding:2px 10px;font-size:.85em;margin:2px}
#st{color:var(--mu);font-size:.85em;margin-left:auto}#back{display:none}
#set{position:fixed;right:12px;top:52px;background:var(--pn);border:1px solid var(--ln);border-radius:12px;padding:12px;display:grid;gap:10px;z-index:5;box-shadow:0 8px 30px #0003}
.sw{width:26px;height:26px;border-radius:50%;padding:0;margin-right:4px}
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:8px 16px;border-radius:99px;z-index:9}
#pa{display:none}
@media(max-width:860px){#app{grid-template-columns:1fr}body[data-v=edit] #side,body[data-v=list] #main{display:none}#back{display:inline-block}}
@media print{body{overflow:visible;height:auto;background:#fff;color:#000}body>*:not(#pa){display:none!important}#pa{display:block;padding:0}}
@media(prefers-reduced-motion:no-preference){.it{transition:background .15s}}
</style>
</head>
<body data-v="list">
<div id="auth" hidden>
 <h1 style="margin:0">Desknotes</h1><p style="margin:0;color:var(--mu)">Your notes, organised by AI.</p>
 <input id="em" type="email" placeholder="Email" autocomplete="email">
 <input id="pw" type="password" placeholder="Password (6+ characters)" autocomplete="current-password">
 <button class="p" id="go">Log in</button>
 <button id="sw">Create an account instead</button><small id="am" style="color:var(--mu)"></small>
</div>
<div id="shared" hidden></div>
<div id="app" hidden>
 <aside id="side">
  <header><button class="p" onclick="newNote()">+ New note</button><button id="mg" onclick="merge()" hidden>Merge</button><button onclick="$('#set').hidden=!$('#set').hidden" style="margin-left:auto">Style</button></header>
  <div style="padding:0 12px 8px"><input id="q" placeholder="Search notes…" oninput="renderList()"></div>
  <div id="list"></div>
  <header><small id="who" style="color:var(--mu);overflow:hidden;text-overflow:ellipsis"></small><button style="margin-left:auto" onclick="sb.auth.signOut()">Log out</button></header>
 </aside>
 <main id="main">
  <div id="bar">
   <button id="back" onclick="document.body.dataset.v='list'">‹ Notes</button>
   <button onclick="toggleEdit()" id="tg">Read</button><button onclick="save(1)">Save</button><button onclick="share()" id="sh">Share</button>
   <button onclick="pdf()">PDF</button><button onclick="dup()">Duplicate</button><button onclick="saveAs()">Save as</button><button onclick="split()">Split</button><button class="d" onclick="del()">Delete</button>
   <span id="st"></span>
  </div>
  <div id="doc"><input id="title" placeholder="Title" oninput="touch()"><textarea id="body" placeholder="Start writing… AI will understand and remember it." oninput="touch()"></textarea><div id="view" hidden></div></div>
  <div id="ai">
   <div class="r"><input id="ask" placeholder="Ask your notes: “what did we decide about the launch?”" style="flex:1;min-width:200px" onkeydown="if(event.key=='Enter')ask()"><button class="p" onclick="ask()">Ask</button></div>
   <div class="r"><button onclick="fmt()">✨ Format</button><button onclick="resume()">Resume</button><button onclick="dates()">Dates</button><button id="ud" onclick="undoAI()" hidden>Undo AI</button></div>
   <div id="out"></div>
  </div>
 </main>
</div>
<div id="set" hidden>
 <div><span class="sw" style="display:none"></span><span id="sws"></span></div>
 <div><button onclick="pref('theme',prefs.theme=='dark'?'light':'dark')">Light / Dark</button> <button onclick="pref('font',{sans:'serif',serif:'mono',mono:'sans'}[prefs.font])">Font</button></div>
 <div><button onclick="pref('size',Math.max(13,prefs.size-1))">A−</button> <button onclick="pref('size',Math.min(24,prefs.size+1))">A+</button></div>
</div>
<div id="pa" class="pa"></div><div id="toast" hidden></div>
<script>
const SB_URL='YOUR_SUPABASE_URL',SB_KEY='YOUR_SUPABASE_ANON_KEY';
const $=s=>document.querySelector(s);
if(!window.supabase||!window.marked||!window.DOMPurify||SB_URL.startsWith('YOUR_')){document.body.innerHTML='<p style="padding:24px;font:16px system-ui">'+(SB_URL.startsWith('YOUR_')?'Add your Supabase URL and anon key at the top of the script in index.html.':'Could not load libraries. Check your connection and reload.')+'</p>';throw new Error('setup')}
const sb=supabase.createClient(SB_URL,SB_KEY);
const md=t=>DOMPurify.sanitize(marked.parse(t||'')),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let pause=0,busy=0,uid=null,notes=[],cur=null,sel=new Set(),T1,T2,undo=null,editing=true,signup=false;
const FONTS={sans:'system-ui,-apple-system,"Segoe UI",sans-serif',serif:'Georgia,"Times New Roman",serif',mono:'ui-monospace,Menlo,Consolas,monospace'},COLORS=['#0f8b8d','#5b5bd6','#d6336c','#e8590c','#2f9e44','#7048e8'];
let prefs={accent:COLORS[0],theme:'light',font:'sans',size:16};try{Object.assign(prefs,JSON.parse(localStorage.p||'{}'))}catch{}
function pref(k,v){prefs[k]=v;try{localStorage.p=JSON.stringify(prefs)}catch{}applyPrefs()}
function applyPrefs(){const r=document.documentElement;r.dataset.t=prefs.theme;r.style.setProperty('--ac',prefs.accent);r.style.setProperty('--fs',prefs.size+'px');r.style.setProperty('--ff',FONTS[prefs.font]);
 $('#sws').innerHTML=COLORS.map(c=>`<button class=sw style="background:${c}" onclick="pref('accent','${c}')" aria-label="Accent ${c}"></button>`).join('')}
function toast(m){const t=$('#toast');t.textContent=m;t.hidden=false;clearTimeout(t.h);t.h=setTimeout(()=>t.hidden=true,2600)}
const status=s=>$('#st').textContent=s;

async function init(){applyPrefs();const s=new URLSearchParams(location.search).get('s');if(s)return shared(s);
 sb.auth.onAuthStateChange((e,se)=>{if(se){if(uid!==se.user.id){uid=se.user.id;setTimeout(()=>start(se),0)}}else{uid=null;sel.clear();showAuth()}});}
async function shared(id){const{data}=await sb.rpc('get_shared_note',{sid:id}),n=data&&data[0],el=$('#shared');el.hidden=false;
 el.style.display='block';el.innerHTML=n?`<div style="padding:16px 24px"><h1>${esc(n.title)}</h1>${md(n.content)}<p style="color:var(--mu)"><small>Shared with Desknotes</small></p></div>`:'<p style="padding:24px">This link is no longer shared.</p>';if(n)hl(el)}
function showAuth(){$('#app').hidden=true;$('#auth').hidden=false;notes=[];cur=null}
$('#pw').onkeydown=e=>{if(e.key=='Enter')$('#go').click()};
$('#sw').onclick=()=>{signup=!signup;$('#go').textContent=signup?'Sign up':'Log in';$('#sw').textContent=signup?'I have an account':'Create an account instead'};
$('#go').onclick=async()=>{const c={email:$('#em').value,password:$('#pw').value};$('#am').textContent='…';
 const{data,error}=await(signup?sb.auth.signUp(c):sb.auth.signInWithPassword(c));
 $('#am').textContent=error?error.message:(signup&&!data.session?'Check your email to confirm your account.':'')};
async function start(se){$('#auth').hidden=true;$('#app').hidden=false;$('#who').textContent=se.user.email;await load();notes.length?openNote(notes[0].id,1):renderList()}

async function load(){const{data}=await sb.from('notes').select('*').order('updated_at',{ascending:false}).limit(300);notes=data||[];renderList()}
function renderList(){const q=($('#q').value||'').toLowerCase();notes.sort((a,b)=>b.updated_at.localeCompare(a.updated_at));
 $('#list').innerHTML=notes.filter(n=>!q||(n.title+n.content+n.summary+n.tags).toLowerCase().includes(q)).map(n=>`<div class="it ${cur&&cur.id==n.id?'on':''}" onclick="openNote('${n.id}')"><input type=checkbox ${sel.has(n.id)?'checked':''} onclick="event.stopPropagation();tick('${n.id}')" aria-label="Select"><div style="min-width:0"><b>${esc(n.title)}${n.share_id?' 🔗':''}</b><small>${esc(n.summary||n.content.slice(0,90))}</small>${(n.tags||[]).map(t=>`<span class=chip style="background:var(--bg)">${esc(t)}</span>`).join('')}</div></div>`).join('')||'<p style="padding:16px;color:var(--mu)">No notes yet. Create one and start writing.</p>';
 $('#mg').hidden=sel.size<2;$('#mg').textContent='Merge ('+sel.size+')'}
function tick(id){sel.has(id)?sel.delete(id):sel.add(id);renderList()}
function openNote(id,quiet){save();cur=notes.find(n=>n.id==id);if(!cur)return;$('#title').value=cur.title;$('#body').value=cur.content;undo=null;$('#ud').hidden=true;$('#out').innerHTML='';
 $('#sh').textContent=cur.share_id?'Unshare':'Share';setEdit(true);status('');if(!quiet)document.body.dataset.v='edit';renderList()}
async function newNote(o={}){const{data,error}=await sb.from('notes').insert({title:'Untitled',content:'',...o}).select().single();if(error)return toast(error.message);notes.unshift(data);openNote(data.id);$('#title').focus()}
function touch(){status('Saving…');clearTimeout(T1);T1=setTimeout(save,700);clearTimeout(T2);T2=setTimeout(remember,8000)}
async function save(force){if(!cur)return;clearTimeout(T1);const n=cur,t=$('#title').value||'Untitled',c=$('#body').value;if(!force&&t==n.title&&c==n.content)return;
 n.title=t;n.content=c;n.updated_at=new Date().toISOString();const{error}=await sb.from('notes').update({title:t,content:c,updated_at:n.updated_at}).eq('id',n.id);status(error?'Not saved':'Saved');if(error)toast(error.message);renderList()}
async function remember(){const n=cur;if(!n||n.content.length<30||n._r===n.content||Date.now()<pause)return;n._r=n.content;try{const r=await aiJson('remember',{note:n.title+'\n'+n.content});n.summary=String(r.summary||'');n.tags=(r.tags||[]).slice(0,5);await sb.from('notes').update({summary:n.summary,tags:n.tags}).eq('id',n.id);renderList()}catch{}}
async function del(){if(!cur||!confirm('Delete "'+cur.title+'"?'))return;const id=cur.id;const{error}=await sb.from('notes').delete().eq('id',id);if(error)return toast(error.message);notes=notes.filter(n=>n.id!=id);cur=null;$('#title').value=$('#body').value='';document.body.dataset.v='list';notes.length?openNote(notes[0].id,1):renderList()}
async function dup(){await save();cur&&newNote({title:cur.title+' (copy)',content:cur.content,summary:cur.summary,tags:cur.tags})}
async function saveAs(){await save();if(!cur)return;const t=prompt('Save as…',cur.title+' (copy)');t&&newNote({title:t,content:cur.content,summary:cur.summary,tags:cur.tags})}
async function share(){if(!cur)return;const id=cur.share_id?null:crypto.randomUUID().replaceAll('-','');const{error}=await sb.from('notes').update({share_id:id}).eq('id',cur.id);if(error)return toast(error.message);cur.share_id=id;
 if(id){const u=location.origin+'/?s='+id;try{await navigator.clipboard.writeText(u)}catch{}toast('Link copied · anyone with it can read this note')}else toast('Sharing turned off');$('#sh').textContent=id?'Unshare':'Share';renderList()}
function setEdit(e){editing=e;$('#body').hidden=!e;$('#view').hidden=e;$('#tg').textContent=e?'Read':'Edit';if(!e){$('#view').innerHTML=md($('#body').value);hl($('#view'))}}
const toggleEdit=()=>setEdit(!editing);
function pdf(){$('#pa').innerHTML='<h1>'+esc($('#title').value)+'</h1>'+md($('#body').value);hl($('#pa'));document.title=$('#title').value||'Note';window.print();document.title='Desknotes'}
function hl(el){const re=/(\d{4}-\d{2}-\d{2}|\d{1,2}[\/.]\d{1,2}[\/.]\d{2,4}|(?:Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec)[a-z]*\.? \d{1,2}(?:, \d{4})?|\b\d{1,2}:\d{2}(?:\s?[AP]M)?)/gi,w=document.createTreeWalker(el,NodeFilter.SHOW_TEXT),a=[];
 while(w.nextNode()){re.lastIndex=0;if(re.test(w.currentNode.data))a.push(w.currentNode)}re.lastIndex=0;
 a.forEach(n=>{const s=document.createElement('span');s.innerHTML=esc(n.data).replace(re,'<mark>$1</mark>');n.replaceWith(s)})}

async function ai(action,p){const{data:{session}}=await sb.auth.getSession();if(!session)throw new Error('Please log in again');const r=await fetch('/api/ai',{method:'POST',headers:{'content-type':'application/json',authorization:'Bearer '+session.access_token},body:JSON.stringify({action,...p})});
 const j=await r.json().catch(()=>({}));if(!r.ok){if(r.status==429)pause=Date.now()+(j.retry||20)*1000;throw new Error(j.error||'AI error '+r.status)}return j.text}
const aiJson=async(a,p)=>{const t=await ai(a,p),m=t.match(/\{[\s\S]*\}/);try{return JSON.parse(m?m[0]:t)}catch{throw new Error('AI gave an unreadable answer. Try again.')}};
async function run(msg,fn){if(busy)return toast('AI is still working…');if(Date.now()<pause)return toast('AI is cooling down. Try again in '+Math.ceil((pause-Date.now())/1000)+'s');busy=1;$('#out').innerHTML='<i style="color:var(--mu)">'+msg+'</i>';try{await fn()}catch(e){$('#out').textContent='';toast(e.message)}finally{busy=0}}
const text=()=>'# '+$('#title').value+'\n'+$('#body').value;
const fmt=()=>run('Formatting…',async()=>{if(!$('#body').value.trim())throw new Error('Write something first');undo=$('#body').value;const t=await ai('format',{note:$('#body').value});$('#body').value=t;$('#ud').hidden=false;$('#out').innerHTML='';setEdit(true);touch()});
function undoAI(){if(undo!=null){$('#body').value=undo;undo=null;$('#ud').hidden=true;touch()}}
const resume=()=>run('Writing resume…',async()=>{const t=await ai('resume',{note:text()});$('#out').innerHTML=md(t)+'<button id=ins>Add to note</button>';$('#ins').onclick=()=>{$('#body').value+='\n\n## Summary\n'+t;touch();setEdit(editing)}});
const dates=()=>run('Finding dates…',async()=>{const r=await aiJson('dates',{note:text()});$('#out').innerHTML=(r.items||[]).map(i=>`<p><mark>${esc(i.when)}</mark> ${esc(i.what)}</p>`).join('')||'No dates found.'});
function pick(q){const w=q.toLowerCase().split(/\W+/).filter(x=>x.length>2);return notes.map(n=>{const h=(n.title+' '+n.summary+' '+n.tags+' '+n.content).toLowerCase();return[w.reduce((a,x)=>a+(h.includes(x)?1:0),0),n]}).sort((a,b)=>b[0]-a[0]).slice(0,8).map(x=>x[1])}
const ask=()=>{const q=$('#ask').value.trim();if(!q)return;run('Searching your notes…',async()=>{
 const d=pick(q).filter(n=>!cur||n.id!=cur.id).map(n=>({id:n.id,title:n.title,summary:n.summary,tags:n.tags,text:n.content.slice(0,600)}));
 if(cur)d.unshift({id:cur.id,title:'CURRENT NOTE: '+cur.title,text:$('#body').value.slice(0,3000)});
 const r=await aiJson('ask',{prompt:q,notes:d});$('#out').innerHTML=md(r.answer)+(r.ids||[]).map(id=>{const n=notes.find(x=>x.id==id);return n?`<button class=chip onclick="openNote('${id}')">${esc(n.title)}</button>`:''}).join('')})};
async function merge(){const ns=notes.filter(n=>sel.has(n.id));run('Merging…',async()=>{let t;try{t=await ai('merge',{note:ns.map(n=>'# '+n.title+'\n'+n.content).join('\n\n---\n\n')})}catch{t=ns.map(n=>'# '+n.title+'\n'+n.content).join('\n\n')}
 sel.clear();await newNote({title:ns[0].title+' + '+(ns.length-1)+' more',content:t});$('#out').innerHTML=''})}
async function split(){await save();if(!cur)return;run('Splitting…',async()=>{const r=await aiJson('split',{note:text()});const ns=(r.notes||[]).filter(n=>n.title&&n.content).map(n=>({title:String(n.title),content:String(n.content)}));if(ns.length<2)return toast('Nothing to split');
 const{data,error}=await sb.from('notes').insert(ns).select();if(error)throw error;notes.unshift(...data);$('#out').innerHTML='';renderList();toast('Split into '+data.length+' notes (original kept)')})}
init();
</script>
</body>
</html>
